version: 2
updates:
- package-ecosystem: npm
  directory: "/"
  cooldown:
    default-days: 7
  schedule:
    interval: daily
    time: "04:00"
  groups:
    lint:
      patterns:
        - "*eslint*"
        - "typescript"
        - "prettier"
    frontend:
      patterns:
        - "axios"
        - "chart.js"
        - "globals"
        - "moment"
        - "react*"
        - "@types/react*"
        - "vite"
        - "@vitejs/*"

  open-pull-requests-limit: 99