version: 2
updates:
- package-ecosystem: npm
  directory: "/"
  cooldown:
    default-days: 7
  schedule:
    interval: daily
    time: "04:00"
  groups:
    lint:
      patterns:
        - "*eslint*"
        - "typescript"
        - "prettier"
    react:
      patterns:
        - "react*"
        - "@types/react*"
    vite:
      patterns:
        - "vite"
        - "@vitejs/*"

  open-pull-requests-limit: 99